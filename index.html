<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiln</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Kiln</div>
    <nav>
      <a href="#">Browse</a>
      <a href="#">Publish your game</a>
      <a href="#">Log in</a>
    </nav>
  </header>

  <section class="hero">
    <h1>A home for human-made games</h1>
    <p>Every game here is declared by the people who made it.</p>
  </section>

 <main>
  <h2>Featured games</h2>
  <input id="search" class="search" type="text" placeholder="Search games, developers, or genres">
  <div class="grid" id="game-grid"></div>
</main>

  <footer>
    <p>&copy; Kiln</p>
  </footer>
<script src="script.js"></script>
</body>
</html>
