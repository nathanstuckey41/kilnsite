<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiln</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Kiln</div>
    <nav>
      <a href="#">Browse</a>
      <a href="publish.html">Publish your game</a>
     <a href="auth.html" id="auth-link">Log in</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Games that deserve to be found</h1>
    <p>List your game once. Get it discovered across Steam, Newgrounds, and itch.io</p>
  </section>

 <main>
  <main>
  <h2>Browse games</h2>

  <input id="search" class="search" type="text" placeholder="Search by title, developer, or tag">

  <div class="filters">
    <select id="f-genre">
      <option value="">All genres</option>
      <option value="action">Action</option>
      <option value="platformer">Platformer</option>
      <option value="puzzle">Puzzle</option>
      <option value="adventure">Adventure</option>
      <option value="rpg">RPG</option>
      <option value="strategy">Strategy</option>
      <option value="simulation">Simulation</option>
      <option value="horror">Horror</option>
      <option value="narrative">Narrative</option>
      <option value="shooter">Shooter</option>
      <option value="sports_racing">Sports and racing</option>
      <option value="other">Other</option>
    </select>

    <select id="f-length">
      <option value="">Any length</option>
      <option value="under_15_min">Under 15 minutes</option>
      <option value="15_to_60_min">15 to 60 minutes</option>
      <option value="1_to_3_hours">1 to 3 hours</option>
      <option value="over_3_hours">Over 3 hours</option>
    </select>

    <select id="f-players">
      <option value="">Any players</option>
      <option value="single">Single player</option>
      <option value="multi">Multiplayer</option>
    </select>

    <select id="f-controls">
      <option value="">Any controls</option>
      <option value="keyboard">Keyboard</option>
      <option value="mouse">Mouse</option>
      <option value="gamepad">Gamepad</option>
      <option value="touch">Touch</option>
    </select>

    <select id="f-sort">
      <option value="new">Newest first</option>
      <option value="title">Title A to Z</option>
    </select>

    <label class="check-filter">
      <input type="checkbox" id="f-noai"> Hide games that use AI
    </label>
  </div>

  <p id="result-count" class="hint"></p>
  <div class="grid" id="game-grid"></div>
</main>
</main>

  <footer>
    <p>&copy; Kiln</p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="session.js"></script>
<script src="labels.js"></script>
<script src="script.js"></script>
</body>
</html>
